<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSP Studio - Support</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --sub-text: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .logo-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--sub-text);
            margin-bottom: 2rem;
        }

        .info-card {
            background-color: var(--bg-color);
            padding: 1.2rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            color: var(--text-color);
            line-height: 1.6;
        }

        .contact-btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .contact-btn:hover {
            background-color: #1d4ed8;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--sub-text);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-title">BSP Studio</div>
        <div class="subtitle">Official App Support Center</div>

        <div class="info-card">
            <p><strong>앱 이용 중 문의사항이나 불편한 점이 있으신가요?</strong></p>
            <p>아래 메일로 문의해 주시면 확인 후 신속하게 답변해 드리겠습니다.</p>
        </div>

        <footer>
            &copy; BSP Studio. All rights reserved.
        </footer>
    </div>

</body>
</html>
