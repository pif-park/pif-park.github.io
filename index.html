<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSP Studio - サポート</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --sub-text: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .logo-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--sub-text);
            margin-bottom: 2rem;
        }

        .info-card {
            background-color: var(--bg-color);
            padding: 1.2rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            color: var(--text-color);
            line-height: 1.6;
        }

        .contact-btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1rem;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }

        .contact-btn:hover {
            background-color: #1d4ed8;
        }

        .email-display {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--sub-text);
            word-break: break-all;
            user-select: all; /* 클릭 시 전체 선택 가능 */
        }

        .copy-alert {
            display: none;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #16a34a;
            font-weight: 600;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--sub-text);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-title">BSP Studio</div>
        <div class="subtitle">公式アプリサポートページ</div>

        <div class="info-card">
            <p><strong>アプリに関するお問い合わせ・不具合のご報告</strong></p>
            <p>アプリのご利用に関するご質問やご意見がございましたら、下記よりご連絡ください。</p>
            
            <button class="contact-btn" onclick="sendMail()">お問い合わせはこちら</button>
            
            <div class="email-display">
                メールアドレス: <strong>bpark.apps@gmail.com</strong>
            </div>
            <div id="copyAlert" class="copy-alert">
                ✓ メールアドレスをコピーしました！
            </div>
        </div>

        <footer>
            &copy; BSP Studio. All rights reserved.
        </footer>
    </div>

    <script>
        function sendMail() {
            const email = "bpark.apps@gmail.com";
            
            // 1. 클립보드에 이메일 주소 복사
            navigator.clipboard.writeText(email).then(() => {
                const alertBox = document.getElementById("copyAlert");
                alertBox.style.display = "block";
                setTimeout(() => {
                    alertBox.style.display = "none";
                }, 3000);
            });

            // 2. 메일 앱 실행 시도
            window.location.href = "mailto:" + email;
        }
    </script>

</body>
</html>
